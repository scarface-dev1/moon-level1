# Local Midnight devnet for SealedBid — node + indexer + proof server.
#
# LOCAL DEVELOPMENT ONLY. Do not expose these ports to a public network.
# The `dev` preset of midnight-node pre-mints NIGHT to a genesis seed, so
# deployments work without a faucet. Tear down with:
#
#   npm run devnet:down      # docker compose -f devnet.yml down -v
#
# Bring up with `npm run devnet:up` (uses --wait, so it blocks until every
# service is healthy) or `docker compose -f devnet.yml up -d`.
name: sealedbid-devnet

services:
  node:
    image: midnightntwrk/midnight-node:1.0.0
    container_name: sealedbid-node
    ports:
      - "9944:9944"
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    # "Healthy" means producing blocks, not merely HTTP-up: the probe asks for
    # the hash of block 1 and fails until it exists. The indexer will not start
    # until then, because indexer-standalone 4.3.x exits if it connects while
    # the chain is still at genesis.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"chain_getBlockHash\",\"params\":[1]}' http://localhost:9944 | grep -q '\"result\":\"0x'",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 20s

  indexer:
    # indexer-standalone 4.3.x boots an SPO indexer component whose config
    # hard-requires a Blockfrost API key; a dummy value satisfies the loader on
    # a local devnet. Do not bump to 4.3.4/4.4.0 — those are pre-alpha builds
    # for the future ledger-9 line, not stable releases.
    image: midnightntwrk/indexer-standalone:4.3.3
    container_name: sealedbid-indexer
    restart: on-failure
    ports:
      - "8088:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
      APP__APPLICATION__NETWORK_ID: "undeployed"
      APP__INFRA__NODE__URL: "ws://node:9944"
      APP__INFRA__STORAGE__PASSWORD: "indexer"
      APP__INFRA__PUB_SUB__PASSWORD: "indexer"
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: "indexer"
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__SPO_NODE__URL: "ws://node:9944"
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "local-devnet-dummy-id"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    # The proof-server image is distroless: /bin/sh exists but is not on PATH
    # and there is no curl/wget. CMD-SHELL invokes /bin/sh directly and the
    # probe uses the shell-builtin /dev/tcp redirect. Pinned to 8.1.0 to match
    # the ledger-v8 8.1.0 that Midnight.js 4.1.1 pins client-side.
    image: midnightntwrk/proof-server:8.1.0
    container_name: sealedbid-proof-server
    command: ["midnight-proof-server -v"]
    ports:
      - "6300:6300"
    environment:
      RUST_BACKTRACE: "full"
    # The proof server fetches its structured reference strings and the
    # Zswap/Dust proving keys from srs.midnight.network on first use (~500 MB,
    # one time), so it needs working DNS and IPv4 egress.
    #
    # It is deliberately attached to Docker's *default* bridge rather than the
    # compose project network: on some hosts (observed on Azure) Docker's
    # embedded resolver only serves the project network's own service names and
    # returns nothing for public hosts, so the proof server exits 1 with
    # "Failed to fetch data from https://srs.midnight.network". The proof server
    # never talks to the devnet's node or indexer, so it does not need the
    # project network. See the Troubleshooting section of the README.
    network_mode: bridge
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/6300"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
